name: Virgin
type: theme
description: 'Thème front du projet, sous-thème d''Olivero.'
package: Custom
core_version_requirement: ^11
base theme: olivero
libraries:
  - virgin/global
regions:
  header: Header
  primary_menu: 'Primary menu'
  secondary_menu: 'Secondary menu'
  hero: 'Hero (full width)'
  highlighted: Highlighted
  breadcrumb: Breadcrumb
  social: 'Social Bar'
  content_above: 'Content Above'
  content: Content
  sidebar: Sidebar
  content_below: 'Content Below'
  footer_top: 'Footer Top'
  footer_bottom: 'Footer Bottom'
# Interface translations shipped with the theme (strings used in templates),
# imported by "drush locale:check && drush locale:update".
'interface translation project': virgin
'interface translation server pattern': themes/custom/virgin/translations/%language.po
